services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: rag_escenarios_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: rag_escenarios_lel
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d rag_escenarios_lel']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
